name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills and docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run deterministic validation
        run: python -X utf8 scripts/validate_repo.py

      - name: Smoke test generic installer
        shell: bash
        run: |
          target="$(mktemp -d)"
          python -X utf8 scripts/install_skill.py --skill project-definition --target "$target"
          test -f "$target/project-definition/SKILL.md"
